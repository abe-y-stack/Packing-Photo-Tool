<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>梱包写真ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="window.__jspdfFailed = true;"></script>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:    #111113;
  --mute:   #8e8e93;
  --line:   #e8e8ec;
  --paper:  #ffffff;
  --wash:   #f7f7f9;
}

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

.shell {
  max-width: 420px;
  margin: 0 auto;
  padding: 0 22px 120px;
}

/* ── Title ── */
h1 {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.01em;
  padding: 34px 0 26px;
}

/* ── Section ── */
.sec { padding: 22px 0; border-top: 1px solid var(--line); }
.sec:first-of-type { border-top: none; padding-top: 0; }

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  color: var(--mute);
  letter-spacing: 0.09em;
  margin-bottom: 14px;
}

/* ── Fields ── */
.row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 0;
}
.row + .row { border-top: 1px solid var(--line); }
.row label {
  font-size: 14px;
  width: 68px;
  flex-shrink: 0;
  color: var(--mute);
}
.row input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  font-size: 16px;
  font-family: inherit;
  color: var(--ink);
  background: transparent;
  padding: 2px 0;
  -webkit-appearance: none;
}
.row input::placeholder { color: #c7c7cc; }

/* ── Path ── */
.path {
  font-size: 12.5px;
  color: var(--mute);
  margin-top: 16px;
  line-height: 1.8;
  word-break: break-all;
}
.path b { color: var(--ink); font-weight: 600; }

/* ── Photos ── */
.add {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  height: 52px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--wash);
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.add:active { background: #eeeef1; }

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-top: 14px;
}
.cell {
  position: relative;
  aspect-ratio: 1;
  border-radius: 9px;
  overflow: hidden;
  background: var(--wash);
}
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell .n {
  position: absolute; left: 3px; bottom: 3px;
  font-size: 9px; font-weight: 700; color: #fff;
  background: rgba(0,0,0,.5);
  padding: 1px 4px; border-radius: 4px;
}
.cell button {
  position: absolute;
  width: 19px; height: 19px;
  border: none; border-radius: 50%;
  background: rgba(0,0,0,.5); color: #fff;
  font-size: 11px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
.cell .rot { right: 3px; bottom: 3px; }
.cell .del { right: 3px; top: 3px; }

.tally { font-size: 12.5px; color: var(--mute); margin-top: 12px; }

/* ── Toggle ── */
.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.toggle span { font-size: 14.5px; font-weight: 500; }
.sw { position: relative; width: 46px; height: 28px; flex-shrink: 0; }
.sw input { opacity: 0; width: 0; height: 0; }
.sw i {
  position: absolute; inset: 0;
  background: #dcdce1; border-radius: 28px;
  cursor: pointer; transition: background .22s;
}
.sw i::after {
  content: ''; position: absolute;
  width: 24px; height: 24px; left: 2px; top: 2px;
  background: #fff; border-radius: 50%;
  transition: transform .22s;
  box-shadow: 0 1px 3px rgba(0,0,0,.22);
}
.sw input:checked + i { background: var(--ink); }
.sw input:checked + i::after { transform: translateX(18px); }

/* ── Footer bar ── */
.bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,.94);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--line);
  padding: 12px 22px calc(12px + env(safe-area-inset-bottom));
}
.bar-in { max-width: 420px; margin: 0 auto; }

.go {
  width: 100%;
  height: 52px;
  border: none; border-radius: 100px;
  background: var(--ink); color: #fff;
  font-size: 16px; font-weight: 700; font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .15s, transform .1s;
}
.go:active { transform: scale(.985); opacity: .8; }
.go:disabled { opacity: .35; transform: none; }

.track { height: 2px; background: var(--line); border-radius: 2px; margin-bottom: 12px; display: none; }
.track i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 2px; transition: width .3s; }

.note {
  font-size: 12.5px; color: var(--mute);
  text-align: center; margin-top: 10px;
  min-height: 17px; line-height: 1.6; word-break: break-all;
}
.note a { color: var(--ink); font-weight: 600; }

</style>
</head>
<body>

<div class="shell">

  <h1>梱包写真ツール</h1>

  <div class="sec">
    <div class="row">
      <label for="shipDate">出荷日</label>
      <input type="date" id="shipDate" onchange="drawPath()">
    </div>
    <div class="row">
      <label for="projectName">案件名</label>
      <input type="text" id="projectName" placeholder="鬼塚工務店（〇〇様邸）第〇便"
             autocomplete="off" oninput="drawPath()">
    </div>
    <div class="path">
      G2_出荷写真 › <b id="pMonth">—</b> › <b id="pProj">—</b>
    </div>
  </div>

  <div class="sec">
    <div class="eyebrow">写真</div>
    <button class="add" onclick="document.getElementById('pick').click()">
      写真を追加
    </button>
    <input type="file" id="pick" accept="image/*" multiple style="display:none" onchange="onPick(this)">
    <div class="grid" id="grid"></div>
    <div class="tally" id="tally"></div>
  </div>

  <div class="sec">
    <div class="toggle">
      <span>G2_出荷写真 に保存</span>
      <label class="sw">
        <input type="checkbox" id="optDrive" checked><i></i>
      </label>
    </div>
  </div>

</div>

<div class="bar">
  <div class="bar-in">
    <div class="track" id="track"><i id="fill"></i></div>
    <button class="go" id="go" onclick="run()">PDFを作る</button>
    <div class="note" id="note"></div>
  </div>
</div>


<script>
'use strict';

/* ═══════════════════════════════
   GAS Web App の URL を貼り付け
═══════════════════════════════ */
var GAS_URL = '';


var photos = [];

document.getElementById('shipDate').valueAsDate = new Date();
drawPath();


/* ── 保存先パス ── */
function monthName() {
  var v = document.getElementById('shipDate').value;
  if (!v) return '';
  var d = new Date(v + 'T00:00:00');
  var m = d.getMonth() + 1;
  return '' + d.getFullYear() + (m < 10 ? '0' + m : m);
}

function drawPath() {
  document.getElementById('pMonth').textContent = monthName() || '—';
  document.getElementById('pProj').textContent =
    document.getElementById('projectName').value.trim() || '—';
}


/* ── 写真 ── */
function onPick(input) {
  var files = Array.from(input.files);
  if (!files.length) return;
  var slots = new Array(files.length);
  var done = 0;

  files.forEach(function(file, i) {
    var r = new FileReader();
    r.onload = function(e) {
      slots[i] = { dataUrl: e.target.result, rotation: 0, name: file.name, type: file.type || 'image/jpeg' };
      if (++done === files.length) {
        slots.forEach(function(s) { if (s) photos.push(s); });
        drawGrid();
      }
    };
    r.readAsDataURL(file);
  });
  input.value = '';
}

function drawGrid() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('tally').textContent =
    photos.length ? photos.length + '枚　↻ 回転 ・ ✕ 削除' : '';

  photos.forEach(function(p, i) {
    var cell = document.createElement('div');
    cell.className = 'cell';

    var img = document.createElement('img');
    img.src = p.dataUrl;
    img.style.transform = 'rotate(' + p.rotation + 'deg)';

    var n = document.createElement('div');
    n.className = 'n';
    n.textContent = i + 1;

    var rot = document.createElement('button');
    rot.className = 'rot';
    rot.textContent = '↻';
    rot.onclick = (function(k) { return function() {
      photos[k].rotation = (photos[k].rotation + 90) % 360; drawGrid();
    }; })(i);

    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = (function(k) { return function() {
      photos.splice(k, 1); drawGrid();
    }; })(i);

    cell.appendChild(img); cell.appendChild(n);
    cell.appendChild(rot); cell.appendChild(del);
    grid.appendChild(cell);
  });
}


/* ── 画像処理 ── */
function rotateAsync(dataUrl, rotation) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() {
      var w = img.naturalWidth, h = img.naturalHeight;
      var s = Math.min(1, 1600 / Math.max(w, h));
      var rw = Math.round(w * s), rh = Math.round(h * s);
      var c = document.createElement('canvas');
      var x = c.getContext('2d');
      if (rotation === 90 || rotation === 270) { c.width = rh; c.height = rw; }
      else { c.width = rw; c.height = rh; }
      x.save();
      x.translate(c.width / 2, c.height / 2);
      x.rotate(rotation * Math.PI / 180);
      x.drawImage(img, -rw / 2, -rh / 2, rw, rh);
      x.restore();
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.src = dataUrl;
  });
}

function dims(dataUrl) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() { resolve({ w: img.naturalWidth, h: img.naturalHeight }); };
    img.src = dataUrl;
  });
}

/* 日本語はcanvasで画像化（jsPDF標準フォントが日本語非対応のため） */
function textImg(text, size, weight, color) {
  var ff = "'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif";
  var m = document.createElement('canvas').getContext('2d');
  m.font = weight + ' ' + size + 'px ' + ff;
  var tw = Math.ceil(m.measureText(text).width);
  var pad = Math.ceil(size * 0.15);
  var c = document.createElement('canvas');
  c.width = tw + pad * 2;
  c.height = Math.ceil(size * 1.4);
  var x = c.getContext('2d');
  x.font = weight + ' ' + size + 'px ' + ff;
  x.fillStyle = color;
  x.textBaseline = 'middle';
  x.fillText(text, pad, c.height / 2);
  return { dataUrl: c.toDataURL('image/png'), w: c.width, h: c.height };
}


/* ── 実行 ── */
async function run() {
  var date = document.getElementById('shipDate').value;
  var proj = document.getElementById('projectName').value.trim();
  var toDrive = document.getElementById('optDrive').checked;

  if (!photos.length) { alert('写真を追加してください'); return; }
  if (!date) { alert('出荷日を選んでください'); return; }
  if (!proj) { alert('案件名を入力してください'); return; }

  if (toDrive && !GAS_URL) {
    if (!confirm('保存先が未設定です。PDFの作成だけ進めますか？')) return;
    toDrive = false;
  }

  var go = document.getElementById('go');
  var note = document.getElementById('note');
  var track = document.getElementById('track');
  var fill = document.getElementById('fill');

  go.disabled = true;
  track.style.display = 'block';

  var steps = 1 + (toDrive ? photos.length + 1 : 0);
  var done = 0;
  function tick(msg) {
    done++;
    fill.style.width = Math.round(done / steps * 100) + '%';
    note.textContent = msg;
  }

  var month = monthName();
  var safe = proj.replace(/[\\\/:*?"<>|]/g, '_');
  var pdfName = '梱包写真_' + safe + '.pdf';
  var folderUrl = '';

  try {
    if (window.__jspdfFailed || typeof window.jspdf === 'undefined') {
      throw new Error('PDF機能を読み込めません。通信環境を確認してください');
    }

    note.textContent = 'PDFを作成中';
    var doc = await makePdf();
    doc.save(pdfName);
    tick('PDFを保存しました');

    if (toDrive) {
      for (var i = 0; i < photos.length; i++) {
        var p = photos[i];
        var ext = p.name && p.name.indexOf('.') > -1 ? p.name.slice(p.name.lastIndexOf('.')) : '.jpg';
        var seq = (i < 9 ? '0' : '') + (i + 1);
        note.textContent = '写真をアップロード中 ' + (i + 1) + ' / ' + photos.length;
        var r = await upload({
          month: month, project: safe,
          fileName: safe + '_' + seq + ext,
          mimeType: p.type, base64: p.dataUrl.split(',')[1]
        });
        if (r.folderUrl) folderUrl = r.folderUrl;
        tick('写真 ' + (i + 1) + ' / ' + photos.length);
      }

      note.textContent = 'PDFをアップロード中';
      var rp = await upload({
        month: month, project: safe,
        fileName: pdfName, mimeType: 'application/pdf',
        base64: doc.output('datauristring').split(',')[1]
      });
      if (rp.folderUrl) folderUrl = rp.folderUrl;
      tick('');
    }

    fill.style.width = '100%';
    note.innerHTML = folderUrl
      ? '完了　<a href="' + folderUrl + '" target="_blank">フォルダを開く</a>'
      : '完了';

  } catch (e) {
    console.error(e);
    note.textContent = e.message || '失敗しました';
    fill.style.width = '0';
  }

  go.disabled = false;
}


/* ── PDF生成 ── */
async function makePdf() {
  var list = [];
  for (var i = 0; i < photos.length; i++) {
    list.push(await rotateAsync(photos[i].dataUrl, photos[i].rotation));
  }

  var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

  var per = 16, pages = Math.ceil(list.length / per);
  var pw = 210, ph = 297, ml = 15, hh = 15, gapTop = 3, mb = 9, g = 2.5;
  var gw = pw - ml * 2, gt = hh + gapTop, gh = ph - mb - gt;
  var cw = (gw - g * 3) / 4, ch = (gh - g * 3) / 4;

  for (var p = 0; p < pages; p++) {
    if (p > 0) doc.addPage();

    doc.setFillColor(17, 17, 19);
    doc.rect(0, 0, pw, hh, 'F');

    var t = textImg('梱包写真', 80, '700', '#ffffff');
    var th = 6.5, tw = th * (t.w / t.h);
    doc.addImage(t.dataUrl, 'PNG', ml, (hh - th) / 2, tw, th);

    var s = textImg('株式会社OKUTA / OK-DEPOT   ' + (p + 1) + ' / ' + pages, 48, '400', '#ffffff');
    var sh = 3.4, sw = sh * (s.w / s.h);
    doc.addImage(s.dataUrl, 'PNG', pw - ml - sw, (hh - sh) / 2, sw, sh);

    var page = list.slice(p * per, p * per + per);

    for (var j = 0; j < per; j++) {
      var x = ml + (j % 4) * (cw + g);
      var y = gt + Math.floor(j / 4) * (ch + g);

      doc.setDrawColor(214, 214, 219);
      doc.setLineWidth(0.3);
      doc.rect(x, y, cw, ch);

      if (page[j]) {
        var d = await dims(page[j]);
        var pad = 1.2, capH = 5;
        var aw = cw - pad * 2, ah = ch - capH - pad * 2;
        var sc = Math.min(aw / d.w, ah / d.h);
        var iw = d.w * sc, ih = d.h * sc;
        doc.addImage(page[j], 'JPEG', x + (cw - iw) / 2, y + pad + (ah - ih) / 2, iw, ih);

        doc.setFontSize(6);
        doc.setTextColor(170, 170, 170);
        doc.text('No.' + (p * per + j + 1), x + cw / 2, y + ch - 1.3, { align: 'center' });
      }
    }
  }
  return doc;
}


/* ── アップロード ── */
async function upload(payload) {
  var res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('アップロードに失敗しました');
  var out;
  try { out = JSON.parse(await res.text()); }
  catch (e) { throw new Error('保存先に接続できません'); }
  if (!out.ok) throw new Error(out.error || 'アップロードに失敗しました');
  return out;
}
</script>

</body>
</html>
